server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Batas ukuran body; unggahan berkas tidak lewat sini (langsung ke service
    # Dokumen), jadi nilai kecil sudah cukup.
    client_max_body_size 1m;

    # Jangan umbar versi nginx di header Server.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # INI INTI FILE-NYA: routing React.
    #
    # React Router memegang rute di sisi browser. Di server tidak ada file
    # atau folder bernama "peserta", jadi saat pengguna menekan F5 di
    # /peserta, nginx defaultnya menjawab 404.
    #
    # try_files menyuruh nginx: cari berkas dengan nama itu, lalu cari
    # foldernya; kalau dua-duanya tidak ada, kirim saja index.html dan biar
    # React yang memutuskan halaman mana yang ditampilkan.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Catatan nginx: begitu sebuah location punya add_header sendiri, ia
        # BERHENTI mewarisi add_header dari blok server. Karena itu header
        # keamanan ditulis ulang di tiap location, bukan sekali di atas.
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "DENY"                           always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # index.html tidak boleh di-cache. Kalau di-cache, pengguna masih membuka
    # HTML lama yang menunjuk ke nama berkas JS yang sudah tidak ada setelah
    # deploy — layar jadi putih sampai mereka hard-refresh.
    location = /index.html {
        add_header Cache-Control            "no-cache"                       always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "DENY"                           always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # Sebaliknya, berkas di /assets/ aman di-cache selamanya: Vite menyisipkan
    # hash isi berkas ke dalam namanya (index-a1b2c3d4.js), jadi isi berubah
    # = nama berubah = cache lama otomatis tidak terpakai.
    location /assets/ {
        expires 1y;
        add_header Cache-Control            "public, immutable"              always;
        add_header X-Content-Type-Options   "nosniff"                        always;
    }

    # Dipakai HEALTHCHECK di Dockerfile supaya compose tahu container ini
    # benar-benar siap melayani, bukan sekadar hidup.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
